name: Build APK
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resource and design checks
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/check-strings.py
          python3 tools/check_design_contract.py
          python3 tools/check_experience_assets.py
      - name: Test and build Android
        run: ./gradlew :app:testDebugUnitTest :app:assembleQa --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: StepUp-Monad-APK
          path: app/build/outputs/apk/qa/app-qa.apk
      - name: Publish testnet APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/qa/app-qa.apk StepUp-Monad.apk
          node -e 'const cp=require("child_process");require("fs").writeFileSync("StepUp-test.json",JSON.stringify({commitTime:Number(cp.execSync("git log -1 --format=%ct").toString().trim()),commit:process.env.GITHUB_SHA,version:"2.0.0-monad"}))'
          if gh release view monad-testnet >/dev/null 2>&1; then
            gh release upload monad-testnet StepUp-Monad.apk StepUp-test.json --clobber
          else
            gh release create monad-testnet StepUp-Monad.apk StepUp-test.json --target "$GITHUB_SHA" --prerelease --title "StepUp 2.0 — Monad Testnet" --notes "Android test build for Monad Testnet (10143). Test tokens have no monetary value. Built from the revision recorded in StepUp-test.json."
          fi

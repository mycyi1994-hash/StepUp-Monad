name: Monad verification
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test
        working-directory: contracts
      - run: npm ci && npm test
        working-directory: attester
      - run: npm ci && npm run build:wallet && npm run build:draw && npm test
        working-directory: web
      - run: npm ci && npm test && npm run build
        working-directory: monad
